<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stretch/Contraction Log</title>
<meta name="description" content="Weekly logger for the Stretch/Contraction v4.4 programme.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}

/* Layout: phone-first single column (max 640px). Sticky week bar on top, bottom tab bar
   (Week / Next up / Settings), rest timer floating above the tabs; set rows are 44px tap targets. */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --sunk:#E1E5DF; --ink:#13171A; --muted:#57626A; --line:#D2D8D1;
  --accent:#1F4FD6; --accent-ink:#FFFFFF; --accent-soft:#DEE6FC;
  --done:#157A3D; --done-ink:#FFFFFF; --done-soft:#DCEFE2;
  --deload:#9A6008; --deload-soft:#F5E9D0; --warn:#B42318;
  --pill:#13171A; --pill-ink:#F2F4F1;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:12px; --tabs-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1113; --surface:#171B1E; --sunk:#20262A; --ink:#E8ECEA; --muted:#93A0A6; --line:#2A3236;
    --accent:#7398FF; --accent-ink:#0B1020; --accent-soft:#1D2949;
    --done:#43BE70; --done-ink:#08140C; --done-soft:#15301F;
    --deload:#E5AB4A; --deload-soft:#33270F; --warn:#F08070;
    --pill:#E8ECEA; --pill-ink:#0E1113;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f-body);overscroll-behavior-y:none;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,select:focus-visible,input[type=checkbox]:focus-visible,input[type=date]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- sticky week bar ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:10px 10px}
.r1{display:flex;align-items:center;gap:8px}
.navb{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.navb svg{width:16px;height:16px}
.wk{flex:1;min-width:0;text-align:center}
.wk-n{font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.wk-d{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;justify-content:center}
.badge{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--deload-soft);color:var(--deload)}
.linkb{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.bar{display:flex;gap:3px;margin-top:10px}
.bseg{flex:var(--n) 1 0;min-width:0}
.btrack{height:8px;background:var(--sunk);border-radius:2px;overflow:hidden}
.btrack i{display:block;height:100%;width:var(--p);background:var(--accent);transition:width .25s}
.bseg.full .btrack i{background:var(--done)}
.bseg span{display:block;font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2{display:flex;gap:12px;margin-top:9px;align-items:center;justify-content:space-between}
.r2-l{min-width:0;line-height:1.2}
.r2-l b{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.r2-l small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- controls ---------- */
main.wrap{padding-block:14px calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 110px)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;font:600 13px/1 var(--f-body);padding:10px 12px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.ctl-l{font-size:13px;color:var(--muted)}
.banner{border-radius:var(--r);padding:11px 13px;background:var(--deload-soft);font-size:14px;margin-bottom:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner b{font-weight:600}
.banner.info{background:var(--accent-soft)}
.banner .linkb{font-size:14px;flex:none}

/* ---------- sessions ---------- */
.sess{margin-bottom:18px}
.sess-head{width:100%;display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:10px;background:none;border:0;padding:6px 2px 10px;text-align:left}
.sess-name{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.sess-name small{font:600 13px/1 var(--f-display);color:var(--muted);letter-spacing:.08em;margin-left:6px}
.sess-meta{text-align:right;line-height:1.15}
.sess-meta b{display:block;font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sess-meta span{font-size:12px;color:var(--muted)}
.sess.full .sess-meta b{color:var(--done)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.sess-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.stack{display:grid;gap:10px}
.empty{margin:0;color:var(--muted);font-size:14px;padding:4px 2px}

/* ---------- exercise blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--sunk);font:600 12px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card .ex + .ex{border-top:1px dashed var(--line)}
.ex{padding:12px;display:grid;gap:9px}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.seq{flex:none;min-width:34px;height:34px;padding:0 4px;display:grid;place-items:center;border-radius:7px;background:var(--sunk);font:700 16px/1 var(--f-display)}
.ex.complete .seq{background:var(--done);color:var(--done-ink)}
.ex-title{flex:1;min-width:0}
.ex-title h3{margin:0;font:600 21px/1.1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.for{font-size:12px;color:var(--muted);margin-top:2px}
.tier{flex:none;font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tier.t1{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.meta{font-size:13px;color:var(--muted);line-height:1.4}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill-sel{position:relative;display:inline-flex;max-width:100%}
.pill-sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--bg);font:600 16px/1 var(--f-body);padding:7px 30px 7px 13px;color:var(--accent);width:6.6rem;text-overflow:ellipsis}
.pill-sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);transform:rotate(45deg);pointer-events:none}
.mini{border:1px solid var(--line);border-radius:999px;background:var(--bg);font:600 15px/1 var(--f-body);padding:8px 13px;color:var(--muted)}
.mini[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.notes p{margin:0 0 4px;font-size:14px;max-width:62ch}
.na-note{margin:0;font-size:13px;color:var(--deload);font-weight:600}
.ex.na .sets,.ex.na .ex-head{opacity:.55}
.last{font-size:13px;color:var(--muted)}
.last:empty{display:none}
.last .hint{font-weight:600;margin-left:4px;white-space:nowrap}
.hint.up{color:var(--done)}
.hint.down{color:var(--deload)}

/* ---------- set rows ---------- */
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:2.7rem minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) 3.1rem;gap:6px;align-items:center}
.sl{display:grid;line-height:1.05}
.sl b{font:700 15px var(--f-display);text-transform:uppercase}
.sl small{font-size:11px;color:var(--done);font-weight:600}
.fld{display:flex;align-items:center;gap:4px;height:46px;padding:0 9px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.fld input{all:unset;flex:1;width:100%;min-width:0;font:600 20px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.fld input::placeholder{color:var(--muted);opacity:.75;font-weight:600;font-size:17px}
.fld span{flex:none;font:600 11px/1 var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bw{font:600 14px var(--f-display);color:var(--muted);text-align:center;letter-spacing:.06em}
.tick{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.tick svg{width:22px;height:22px}
.tick:active{transform:scale(.96)}
.set.done .tick{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.set.done .fld{background:var(--done-soft);border-color:transparent}
.set.need .fld.r{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.set .alt{grid-column:2 / -1;font-size:11px;color:var(--muted);margin-top:-2px}
.set .alt:empty{display:none}

/* ---------- next-up view ---------- */
.tier-h{font:700 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:20px 2px 10px}
.tier-h:first-of-type{margin-top:4px}
.unit{margin-bottom:10px}
.unit.over{opacity:.45}
.cut{display:flex;align-items:center;gap:10px;color:var(--accent);font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 14px}
.cut::before,.cut::after{content:"";flex:1;height:1.5px;background:var(--accent)}

/* ---------- settings ---------- */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sec h2{font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
.sec p{margin:0 0 12px;color:var(--muted);font-size:14px}
.sec p:last-child{margin-bottom:0}
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kit label{display:flex;gap:10px;align-items:center;padding:12px 10px;border:1px solid var(--line);border-radius:10px;font-size:15px;min-width:0}
.kit input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.datef{display:flex;gap:10px;align-items:center;font-size:15px;flex-wrap:wrap}
.datef input{font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;font:600 15px/1 var(--f-body)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.6}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabs-h)}
.tabs button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:3px;font:600 12px/1 var(--f-body);color:var(--muted);padding:0}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* ---------- rest timer, toast ---------- */
.rest{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;background:var(--pill);color:var(--pill-ink);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgb(0 0 0 / .28)}
.rest.go{background:var(--done);color:var(--done-ink)}
.rest-t{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:3.2ch}
.rest-l{flex:1;min-width:0;font-size:13px;line-height:1.3}
.rest-l b{display:block;font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.rest-l span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest button{flex:none;border:0;border-radius:10px;padding:11px 12px;font:600 14px/1 var(--f-body);background:rgb(127 127 127 / .24);color:inherit}
.toast{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 84px);background:var(--pill);color:var(--pill-ink);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="r1">
      <button class="navb" id="prevWk" type="button" aria-label="Previous week"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <div class="wk">
        <div class="wk-n" id="wkN">Week 1 of 12</div>
        <div class="wk-d"><span id="wkD"></span><button class="linkb" id="thisWk" type="button" hidden>This week</button></div>
      </div>
      <button class="navb" id="nextWk" type="button" aria-label="Next week"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
    <div class="bar" id="bar"></div>
    <div class="r2">
      <div class="r2-l"><b id="setsDone">0 / 88</b> <span class="ctl-l">sets</span><small id="timeLeft"></small></div>
      <div id="locSeg"></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="rest" id="rest" hidden role="status" aria-live="polite">
  <div class="rest-t" id="restT">0:00</div>
  <div class="rest-l"><b id="restH">Rest</b><span id="restL"></span></div>
  <button id="restAdd" type="button">+15 s</button>
  <button id="restSkip" type="button">Skip</button>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button type="button" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</button>
    <button type="button" data-tab="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 12h7M4 18h5"/><path d="m15 13 3.5 3.5L15 20M18.5 16.5H12"/></svg>Next up</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</button>
  </div>
</nav>

<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
